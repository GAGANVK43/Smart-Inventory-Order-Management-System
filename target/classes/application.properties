# ===================================================================
# SMART INVENTORY & ORDER MANAGEMENT SYSTEM - Application Configuration
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Gaganvk@5556
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# update: Automatically creates or alters DB tables based on JPA entities without dropping existing data.
spring.jpa.hibernate.ddl-auto=update

# Show formatted SQL queries in console for debugging and learning purpose
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Dialect for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open In View pattern configuration
spring.jpa.open-in-view=false

# Spring Boot DevTools Configuration
spring.devtools.restart.enabled=true

version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: inventory-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inventory-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-backend-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - inventory-net

  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory-frontend-ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-api
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge

volumes:
  mysql_data:
